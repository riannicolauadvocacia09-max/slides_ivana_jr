<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Ivana &amp; Júnior · Bodas de Esmeralda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde:    #0F3D2E;
      --verde-esc:#0A2A20;
      --ouro:    #C9A45C;
      --ouro-esc:#8A6A2F;
      --claro:   #D9CFB8;
      --polar:   #FFFDF7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--verde-esc);
      font-family: 'Jost', sans-serif;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 130% 90% at 50% 50%, #15503c 0%, var(--verde-esc) 70%);
      pointer-events: none;
    }

    #cabecalho {
      position: fixed; top: 28px; left: 0; right: 0; z-index: 10;
      text-align: center;
      font-weight: 300;
      font-size: 10.5px;
      letter-spacing: 4.5px;
      text-transform: uppercase;
      color: var(--ouro);
      opacity: .65;
    }

    #rodape {
      position: fixed; bottom: 22px; left: 0; right: 0; z-index: 10;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--claro);
      opacity: .4;
    }

    #debug {
      position: fixed; bottom: 6px; right: 10px; z-index: 20;
      font-size: 10px; color: rgba(255,255,255,.35);
      font-family: monospace;
    }

    /* ── palco ── */
    #palco {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── polaroid ── */
    .polaroid {
      background: var(--polar);
      box-shadow:
        0 28px 80px rgba(0,0,0,.58),
        0 6px 22px  rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .polaroid.retrato  { padding: 14px 14px 42px; width: 370px; }
    .polaroid.paisagem { padding: 14px 14px 42px; width: 590px; }

    .foto-wrap { overflow: hidden; flex-shrink: 0; }
    .polaroid.retrato  .foto-wrap { width: 342px; height: 456px; }
    .polaroid.paisagem .foto-wrap { width: 562px; height: 352px; }

    .foto-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .rotulo {
      position: absolute; top: 7px; left: 0; right: 0;
      text-align: center;
      font-size: 7px; letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--ouro-esc); opacity: .55;
    }

    .separador {
      display: block;
      width: 36px; height: 1px;
      background: var(--ouro);
      opacity: .3;
      margin: 8px auto 0;
    }

    .legenda {
      margin-top: 4px;
      font-family: 'Great Vibes', cursive;
      font-size: 30px;
      color: var(--verde);
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .polaroid.paisagem .legenda { font-size: 32px; }
  </style>
</head>
<body>

<div id="cabecalho">Ivana &amp; Júnior &nbsp;·&nbsp; Bodas de Esmeralda &nbsp;·&nbsp; 40 anos de amor</div>

<div id="palco">
  <div id="frame" style="opacity:0"></div>
</div>

<div id="rodape">Uma história de amor que se tornou família</div>
<div id="debug"></div>

<script>
/* ── frases ── */
const legendasNamoro = [
  'Onde tudo começou...',
  'Cada olhar, uma história',
  'Dois corações em sincronia',
  'O amor que escolhemos',
  'Jovens e apaixonados',
  'Uma promessa de futuro',
  'Sorrisos que o tempo guarda',
  'Sempre juntos',
  'O início de uma grande história',
  'Amor que cresceu a cada dia',
  'Quarenta anos de cumplicidade',
  'E ainda hoje, apaixonados',
];

const legendasFilhos = [
  'Nossa maior obra',
  'Amor que se multiplica',
  'Cada filho, um presente',
  'A família que construímos',
  'Legado de amor',
  'Raízes e asas',
  'Feitos com amor',
  'Nossa história continua',
  'O melhor que fizemos juntos',
  'Amor incondicional',
  'Crescendo juntos',
  'Nossa herança mais preciosa',
  'Laços que nunca se rompem',
  'Uma família, um coração',
  'Memórias que ficam para sempre',
  'Unidos pelo amor',
  'Nossa alegria maior',
  'Cada momento, eterno',
  'Amor que transborda',
  'Nossa família, nossa riqueza',
];

/* ── lista de fotos ── */
const fotos = [
  { src: '1namoro/1.jpeg',   leg: legendasNamoro[0]  },
  { src: '1namoro/2.jpeg',   leg: legendasNamoro[1]  },
  { src: '1namoro/3.jpeg',   leg: legendasNamoro[2]  },
  { src: '1namoro/4.1.jpeg', leg: legendasNamoro[3]  },
  { src: '1namoro/4.3.jpeg', leg: legendasNamoro[4]  },
  { src: '1namoro/4.4.png',  leg: legendasNamoro[5]  },
  { src: '1namoro/4.5.jpeg', leg: legendasNamoro[6]  },
  { src: '1namoro/5.jpeg',   leg: legendasNamoro[7]  },
  { src: '1namoro/6.jpeg',   leg: legendasNamoro[8]  },
  { src: '1namoro/7.jpeg',   leg: legendasNamoro[9]  },
  { src: '1namoro/8.jpeg',   leg: legendasNamoro[10] },
  { src: '1namoro/9.jpeg',   leg: legendasNamoro[11] },
];

const arquivosFilhos = [
  '10.jpeg','10.1.jpeg','11.jpeg','12.jpeg','13.jpeg','14.jpeg',
  '15.jpeg','16.jpeg','17.jpeg','18.jpeg','19.jpeg','20.jpeg',
  '21.jpeg','22.jpeg','23.jpeg','24.jpeg','25.jpeg','26.jpeg',
  '27.jpeg','28.jpeg','29.jpeg','30.jpeg','31.jpeg','32.jpeg',
  '33.jpeg','34.jpeg','35.jpeg','36.jpeg','37.jpeg','38.jpeg',
  '39.jpeg','40.jpeg','41.jpeg','42.jpeg','43.jpeg','44.jpeg',
  '45.jpeg','46.jpeg','47.jpeg','48.jpeg','49.jpeg','50.jpeg',
  '51.jpeg','52.jpeg','53.jpeg','54.jpeg','55.jpeg','56.jpeg',
  '57.jpeg','58.jpeg','59.jpeg','60.jpeg','61.jpeg','62.jpeg',
  '63.jpeg','64.jpeg','65.jpeg','66.jpeg','67.jpeg','68.jpeg',
  '69.jpeg','70.jpeg','71.jpeg','72.jpeg','73.jpeg','74.jpeg',
  '75.jpeg','76.jpeg','77.jpeg','78.jpeg','79.jpeg','80.jpeg',
  '81.jpeg','82.jpeg','83.jpeg','84.jpeg','85.jpeg','86.jpeg',
  '87.jpeg','88.jpeg','89.jpeg','90.jpeg','91.jpeg','92.jpeg',
  '93.jpeg','94.jpeg','95.jpeg','96.jpeg','97.jpeg','98.jpeg',
  '99.jpeg','100.jpeg','101.jpeg','102.jpeg','103.jpeg','104.jpeg',
  '105.jpeg','106.jpeg','107.jpeg','108.jpeg','109.jpeg','110.jpeg',
  '111.jpeg','112.jpeg','113.jpeg','114.jpeg','115.jpeg','116.jpeg',
  '117.jpeg','118.jpeg','119.jpeg','120.jpeg','121.jpeg','122.jpeg',
  '123.jpeg','124.jpeg','125.jpeg','126.jpeg','127.jpeg','128.jpeg',
  '129.jpeg','130.jpeg','131.jpeg','132.jpeg','133.jpeg','134.jpeg',
  '135.jpeg','136.jpeg','137.jpeg','138.jpeg','139.jpeg','140.jpeg',
  '141.jpeg','142.jpeg','143.jpeg','144.jpeg',
];
arquivosFilhos.forEach((n, i) => {
  fotos.push({ src: '2filhos/' + n, leg: legendasFilhos[i % legendasFilhos.length] });
});

/* ── rotações ── */
const rots = fotos.map(() => +(Math.random() * 4 - 2).toFixed(2));

/* ── engine ── */
const frame  = document.getElementById('frame');
const EXIBIR = 8000;
const DUR    = 1200; // duração do fade em ms

let idx    = 0;
let timer  = null;
let pausado = false;
let rodando = false; // lock para evitar sobreposição

function fade(el, de, ate, ms, cb) {
  el.style.opacity = de;
  const inicio = performance.now();
  function step(agora) {
    const p = Math.min((agora - inicio) / ms, 1);
    el.style.opacity = de + (ate - de) * p;
    if (p < 1) requestAnimationFrame(step);
    else { el.style.opacity = ate; if (cb) cb(); }
  }
  requestAnimationFrame(step);
}

function renderizar(foto, rot, w, h) {
  document.getElementById('debug').textContent = foto.src;
  const ori = w >= h ? 'paisagem' : 'retrato';
  frame.innerHTML = `
    <div class="polaroid ${ori}" style="transform:rotate(${rot}deg)">
      <span class="rotulo">Bodas de Esmeralda · 1986 · 2026</span>
      <div class="foto-wrap">
        <img src="${foto.src}" alt="${foto.leg}">
      </div>
      <span class="separador"></span>
      <p class="legenda">${foto.leg}</p>
    </div>`;
}

function preload(src, cb) {
  const img = new Image();
  img.onload  = () => cb(img.naturalWidth, img.naturalHeight);
  img.onerror = () => cb(900, 1600); /* fallback retrato */
  img.src = src;
}

function mostrarSlide(i) {
  if (rodando) return;
  rodando = true;
  const foto = fotos[i];
  const rot  = rots[i];

  preload(foto.src, (w, h) => {
    renderizar(foto, rot, w, h);
    fade(frame, 0, 1, DUR, () => {
      rodando = false;
      if (!pausado) {
        clearTimeout(timer);
        timer = setTimeout(avancar, EXIBIR);
      }
    });
  });
}

function avancar() {
  if (rodando) return;
  fade(frame, 1, 0, DUR, () => {
    idx = (idx + 1) % fotos.length;
    mostrarSlide(idx);
  });
}

/* ── início ── */
mostrarSlide(0);

/* ── teclado ── */
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    pausado = !pausado;
    if (!pausado) { clearTimeout(timer); avancar(); }
    else clearTimeout(timer);
  }
  if (e.code === 'ArrowRight' && !rodando) {
    clearTimeout(timer); avancar();
  }
  if (e.code === 'ArrowLeft' && !rodando) {
    clearTimeout(timer);
    fade(frame, 1, 0, DUR, () => {
      idx = (idx - 1 + fotos.length) % fotos.length;
      mostrarSlide(idx);
    });
  }
});
</script>
</body>
</html>
